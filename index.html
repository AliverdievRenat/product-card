<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Product card</title>
</head>
<body>
  <div class="container">
    <div class="container__header-button">
      <button id="change-color-card-button" class="header-button">Изменить цвет первой карточки</button>
      <button id="change-color-all-card-button" class="header-button">Изменить цвет всех карточек</button>
      <button id="open-google" class="header-button">Открыть google</button>
      <button id="output-console-log" class="header-button">Вывод в консоль лог</button>
      <button id="color-generation" class="header-button">Клик-Клик</button>
    </div>
    <h1 class="header-card-text">Выбери свой продукт</h1>
    <div class="background-image"></div>

    <template id="product-card-template">
      <li class="card">
        <img class="card__img" src="" alt="">
        <span class="card__category"></span>
        <h2 class="card__product-name"></h2>
        <p class="card__product-description"></p>
        <span>Состав:</span>
        <ul class="card__compound"></ul>
        <div class="card__price">
          <span class="card__price-text">Цена</span>
          <data value=""></data>
        </div>
      </li>
    </template>

    <ul class="products"></ul>
  </div>
  
  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script src="homework-9.js" type="module"></script>
  <script src="homework-10.js" type="module"></script>
</body>
</html>
